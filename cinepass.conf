# À inclure depuis C:/Apache24/conf/httpd.conf.
# Ajouter également « 127.0.0.1 cinepass.dz » au fichier hosts Windows.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/Apache24/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName cinepass.dz
    DocumentRoot "C:/Apache24/htdocs/bg-tp5-httpform"
    DirectoryIndex index.html

    <Directory "C:/Apache24/htdocs/bg-tp5-httpform">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog "logs/cinepass-error.log"
    CustomLog "logs/cinepass-access.log" common
</VirtualHost>
